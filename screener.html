<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screener | KFH Trade</title>
  <!-- Set the saved theme before first paint (default: dark) -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('kfht-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="trade.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../index.html" aria-label="KFH Trade home">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>KFH Trade</span>
      </a>

      <nav class="topnav" aria-label="Main">
        <a href="index.html">Markets</a>
        <a href="screener.html" aria-current="page">Screener</a>
        <a href="https://www.kfhtrade.com/en/Trading-Information">Learn</a>
        <a href="https://www.kfhtrade.com/en/Account-Opening">Open an account</a>
      </nav>

      <form class="search" action="screener.html" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="sr-only" for="q">Search stocks</label>
        <input id="q" name="q" type="search" placeholder="Search stocks" autocomplete="off">
      </form>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light mode">
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>

      <!-- Placeholder: points at the existing login until our own is built -->
      <a class="btn" href="https://trading.kfhtrade.com/">Log in</a>
    </div>
  </header>

  <main class="page">

    <div class="subtabs">
      <a class="subtab" href="index.html">Markets</a>
      <a class="subtab" href="screener.html" aria-current="page">Screener</a>
    </div>

    <div class="screener" id="screener">

      <aside class="filters" id="filters" aria-label="Filters">
        <details class="fgroup" open>
          <summary>Markets</summary>
          <div class="fchips" id="f-markets"></div>
        </details>
        <details class="fgroup" open>
          <summary>Market cap</summary>
          <div class="fchips" id="f-cap"></div>
        </details>
        <details class="fgroup" open>
          <summary>Sector</summary>
          <div class="fchips" id="f-sector"></div>
        </details>
        <details class="fgroup">
          <summary>Dividend yield</summary>
          <div class="fchips" id="f-div"></div>
        </details>
        <button class="btn f-clear" id="f-clear" type="button" hidden>Clear filters</button>
      </aside>

      <section class="results" aria-label="Results">
        <div class="res-bar">
          <button class="icon-btn box" id="collapse" type="button" aria-controls="filters" aria-expanded="true" aria-label="Hide filters">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
          </button>

          <div class="seg" id="seg" role="group" aria-label="List">
            <button class="seg-btn" type="button" data-tab="trending" aria-pressed="true">Trending</button>
            <button class="seg-btn" type="button" data-tab="top" aria-pressed="false">Top</button>
            <button class="seg-btn" type="button" data-tab="gainers" aria-pressed="false">Gainers</button>
            <button class="seg-btn" type="button" data-tab="losers" aria-pressed="false">Losers</button>
          </div>

          <span class="result-count" id="count" aria-live="polite"></span>

          <div class="dens" id="dens" role="group" aria-label="Row density">
            <button class="icon-btn box" type="button" data-dens="comfortable" aria-pressed="true" aria-label="Comfortable rows">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <button class="icon-btn box" type="button" data-dens="compact" aria-pressed="false" aria-label="Compact rows">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16M4 9.5h16M4 14h16M4 18.5h16"/></svg>
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="mk sc" id="sc-table">
            <caption class="sr-only">Stocks across Kuwait, Saudi Arabia, UAE, Qatar and the US</caption>
            <thead><tr id="sc-head"></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <p class="foot-note">Demo data. Prices, volumes and charts are illustrative and are not live market quotes.</p>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/screener.js"></script>
</body>
</html>
