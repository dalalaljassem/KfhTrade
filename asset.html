<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock | KFH Trade</title>
  <!-- Set the saved theme before first paint (default: dark) -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('kfht-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="trade.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../index.html" aria-label="KFH Trade home">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>KFH Trade</span>
      </a>

      <nav class="topnav" aria-label="Main">
        <a href="index.html">Markets</a>
        <a href="screener.html">Screener</a>
        <a href="https://www.kfhtrade.com/en/Trading-Information">Learn</a>
        <a href="https://www.kfhtrade.com/en/Account-Opening">Open an account</a>
      </nav>

      <form class="search" action="index.html" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="sr-only" for="q">Search stocks</label>
        <input id="q" name="q" type="search" placeholder="Search stocks" autocomplete="off">
      </form>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light mode">
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>

      <!-- Placeholder: points at the existing login until our own is built -->
      <a class="btn" href="https://trading.kfhtrade.com/">Log in</a>
    </div>
  </header>

  <main class="page">

    <div class="asset-head">
      <a class="back" href="index.html">&larr; Markets</a>
      <div class="who" id="who"></div>
      <button class="icon-btn share" id="share" type="button" aria-label="Copy link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>
        <span class="done" id="share-done" hidden>Link copied</span>
      </button>
      <nav aria-label="On this page">
        <a href="#about">About</a>
        <a href="#performance">Performance</a>
        <a href="#trade">Trade</a>
      </nav>
    </div>

    <div class="title-row">
      <h1 id="title"></h1>
      <span class="badge" id="badge"></span>
    </div>

    <div class="asset-grid">
      <section class="price-card" aria-label="Price chart">
        <div class="price-top">
          <div>
            <div class="price-big" id="price"></div>
            <div class="delta" id="delta"></div>
          </div>
          <div>
            <label class="sr-only" for="ccy">Display currency</label>
            <select class="ccy-select" id="ccy"></select>
          </div>
        </div>

        <div class="chart" id="chart"></div>
        <div class="tf-row" id="tfs" role="group" aria-label="Time range"></div>
      </section>

      <aside class="side">
        <div class="panel" id="stats"></div>

        <div class="panel conv" aria-label="Estimate">
          <label><b id="conv-sym"></b><input id="sh" type="text" inputmode="decimal" value="1" aria-label="Number of shares"></label>
          <span class="swap" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M8 20l-4-4M16 20V4M16 4l4 4"/></svg>
          </span>
          <label><b id="conv-ccy"></b><input id="val" type="text" inputmode="decimal" aria-label="Value"></label>
        </div>

        <div class="cta-card" id="trade">
          <h2 id="cta-title"></h2>
          <!-- Placeholder: points at the existing trading login until our own is built -->
          <a class="btn btn-accent" href="https://trading.kfhtrade.com/">Trade now &rarr;</a>
          <small>You will log in to your KFH Trade account.</small>
        </div>
      </aside>
    </div>

    <section class="about" id="about">
      <h2 id="about-title"></h2>
      <div class="about-grid">
        <div class="panel"><p id="about-text"></p></div>
        <div class="panel">
          <div class="tags" id="about-tags"></div>
          <div id="about-facts"></div>
        </div>
      </div>
    </section>

    <section class="perf" id="performance">
      <h2>Performance</h2>
      <div class="perf-grid" id="perf"></div>
    </section>

  </main>

  <p class="foot-note">Demo data. Prices, volumes and charts are illustrative and are not live market quotes.</p>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/asset.js"></script>
</body>
</html>
